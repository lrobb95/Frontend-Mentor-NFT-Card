<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
<link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | NFT preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
  <body>
    <main>
      <article class="glass-card">
        <div class="card-image-group">
          <div class="overlay">
            <img src="./images/icon-view.svg" alt="image of an eye overlaying NFT">
          </div>
          <img class="nft" src="./images/image-equilibrium.jpg" alt="Equilibrium NFT">
        </div>
        <div class="group-text">
          <h1>Equilibrium #3429</h1>
          <p class="info">Our Equilibrium collection promotes balance and calm.</p>
        </div>
        <div class="group-1">
          <div class="svg-text">
            <img src="./images/icon-ethereum.svg" alt="ethereum icon">
            <span>0.041 ETH</span>
          </div>
          <div class="svg-text">
            <img src="./images/icon-clock.svg" alt="clock icon">
            <p class="clock">3 days left</p>
          </div>
        </div>
        <div class="line"></div>
        <div class="group-2">
          <img src="./images/image-avatar.png" alt="Photo of Jules Wyvern">
          <p>Creation of <span class="author">Jules Wyvern</span></p>
        </div>
      </article>
    </main>
  </body>
</html>
